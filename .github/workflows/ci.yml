name: ci

# Проверки на каждый PR и push в main; образ web собирается и публикуется
# ТОЛЬКО после зелёных проверок и ТОЛЬКО с main (общий конвейер в
# lct-testkit/deploy: локальная сборка → Trivy → push → SBOM/provenance →
# cosign → dispatch в deploy).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "45 3 * * *" # ночью: сверка контракта с backend@main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read # чтение @lct-testkit/rt-ui из GitHub Packages

env:
  HADOLINT_IMAGE: hadolint/hadolint:v2.12.0

jobs:
  check:
    name: lint · check · test · build
    runs-on: [self-hosted, lct]
    timeout-minutes: 30
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # чтение @lct-testkit/rt-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      # registry-url + scope: setup-node пишет пользовательский .npmrc с токеном из NODE_AUTH_TOKEN (job env)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@lct-testkit'

      - name: Установить зависимости (rt-ui — из GitHub Packages)
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: stylelint (цвета только из токенов темы)
        run: pnpm lint:styles

      - name: svelte-check
        run: pnpm check

      - name: Экспорты без вызывающего кода не растут (tools/unused-exports.mjs)
        run: node tools/unused-exports.mjs --max 102

      - name: Unit-тесты + покрытие (пороги в vite.config.ts)
        run: pnpm test:coverage

      - name: Сводка покрытия в PR (по модулям)
        if: always()
        run: node tools/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Числа в README совпадают с кодом (блок STATS)
        run: node tools/fill-stats.mjs --check

      - name: Production build
        run: pnpm build

      - name: Бюджет размера бандла (gzip)
        run: pnpm size

      - name: Аудит зависимостей (runtime, high+)
        run: pnpm audit --prod --audit-level high

      # ночью: полный аудит, включая dev-зависимости и moderate; неблокирующий, печатает в summary
      - name: Аудит всех зависимостей (moderate+, ночью, не блокирует)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          {
            echo '### pnpm audit (все зависимости, moderate+)'
            echo '```'
            pnpm audit --audit-level moderate || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  contract:
    name: контракт API · Dockerfile · секреты
    runs-on: [self-hosted, lct]
    timeout-minutes: 15
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # чтение @lct-testkit/rt-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      # registry-url + scope: setup-node пишет пользовательский .npmrc с токеном из NODE_AUTH_TOKEN (job env)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@lct-testkit'

      - name: Установить зависимости (rt-ui — из GitHub Packages)
        run: pnpm install --frozen-lockfile

      # schema.d.ts и индекс эндпоинтов — производные от docs/openapi.json; если кто-то
      # поправил схему руками или забыл перегенерировать — diff не пустой.
      - name: Типы API соответствуют docs/openapi.json (без дрейфа)
        run: |
          node tools/gen-api.mjs --url docs/openapi.json
          git diff --exit-code -- src/lib/api/schema.d.ts docs/api-endpoints.md docs/openapi.json

      # Контракт фронтенда = контракт backend@main. Нужен токен чтения приватного репозитория;
      # без него шаг честно предупреждает, а не «зеленеет» молча.
      - name: Контракт совпадает с backend@main (openapi.json)
        env:
          BACKEND_READ_TOKEN: ${{ secrets.BACKEND_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_READ_TOKEN}" ]; then
            echo "::warning::BACKEND_READ_TOKEN не задан — сверка с backend@main пропущена (см. Settings -> Secrets репозитория)"
            exit 0
          fi
          curl -fsSL -H "Authorization: Bearer ${BACKEND_READ_TOKEN}" -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/lct-testkit/backend/contents/openapi.json?ref=main" -o "${RUNNER_TEMP}/backend-openapi.json"
          node tools/check-contract.mjs docs/openapi.json "${RUNNER_TEMP}/backend-openapi.json"

      - name: hadolint
        run: docker run --rm -i "${HADOLINT_IMAGE}" hadolint --failure-threshold warning - < Dockerfile

      - name: Trivy fs (уязвимости зависимостей и секреты)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: node_modules,docs

  mock-stand:
    name: мок-стенд · экраны · производительность
    needs: check
    runs-on: [self-hosted, lct]
    timeout-minutes: 20
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # чтение @lct-testkit/rt-ui
      PW_CHANNEL: chromium # свой Chromium Playwright, системного Chrome на раннере нет
      APP_URL: http://127.0.0.1:4273
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@lct-testkit'

      - name: Установить зависимости (rt-ui — из GitHub Packages)
        run: pnpm install --frozen-lockfile

      - name: Production build
        run: pnpm build

      # без --with-deps: на раннере нет sudo, системные библиотеки браузера должны быть на машине заранее
      - name: Chromium для Playwright
        run: pnpm exec playwright install chromium

      - name: Запустить production-клиент (preview)
        run: |
          nohup pnpm exec vite preview --host 127.0.0.1 --port 4273 --strictPort > "${RUNNER_TEMP}/preview.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fsS "${APP_URL}/config.json" > /dev/null && exit 0; sleep 1; done
          cat "${RUNNER_TEMP}/preview.log"; exit 1

      - name: Каждый экран открывается на моке (ok / empty / error), запросов вне мока нет
        run: node tools/mock/selfcheck.mjs

      - name: Поведение общих блоков на моке (пусто, ошибка, клавиатура)
        run: node tools/mock/ui-checks.mjs

      - name: XSS-векторы в комментарии сделки безвредны
        run: node tools/xss-check.mjs

      # шумно на двух vCPU: пока не блокирует; медиана из трёх прогонов, предел +20 % от tools/perf-baseline.json
      - name: Производительность списка на 1000 сделок
        continue-on-error: true
        run: node tools/perf.mjs --check

  publish:
    name: publish образа web
    needs: [check, contract]
    if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: lct-testkit/deploy/.github/workflows/docker-publish.yml@main
    with:
      image: web
      event-type: frontend-image-built
    # Явно, а не inherit: NODE_AUTH_TOKEN (чтение приватного пакета rt-ui при сборке образа) — это GITHUB_TOKEN;
    # доступ ему даёт настройка пакета «Manage Actions access» -> frontend.
    secrets:
      DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
