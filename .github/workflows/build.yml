name: build

# Собирает и пушит образ web (SPA-клиент за встроенным Caddy, см. Dockerfile)
# и уведомляет deploy repository_dispatch'ем, чтобы бот там проставил
# tag/digest в images.yaml. Тот же паттерн, что backend/.github/workflows/build.yml.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build + push + notify deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Короткий sha
        id: sha
        run: echo "short=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Восстановить vendor/ (приватный пакет rt-ui, в git не лежит — см. шапку Dockerfile)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p vendor
          if ! gh release download vendor-assets \
              --repo "${{ github.repository }}" \
              --pattern "lct-testkit-rt-ui-*.tgz" \
              --dir vendor --clobber 2>&1; then
            echo "::error::Нет релиза 'vendor-assets' с приватным пакетом rt-ui"
            echo "::error::(или пуст доступ GITHUB_TOKEN). Разовая настройка —"
            echo "::error::из корня frontend с vendor/lct-testkit-rt-ui-*.tgz на месте:"
            echo "::error::  gh release create vendor-assets \\"
            echo "::error::    --repo ${{ github.repository }} \\"
            echo "::error::    --title 'Vendor assets (private, build-time only)' \\"
            echo "::error::    --notes 'Приватный пакет заказчика, не публиковать содержимое' \\"
            echo "::error::    vendor/lct-testkit-rt-ui-*.tgz"
            exit 1
          fi
          ls -la vendor/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/lct-testkit/web:${{ steps.sha.outputs.short }}
          cache-from: type=registry,ref=ghcr.io/lct-testkit/web:buildcache
          cache-to: type=registry,ref=ghcr.io/lct-testkit/web:buildcache,mode=max

      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/lct-testkit/web:${{ steps.sha.outputs.short }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Уведомить deploy
        env:
          DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_DISPATCH_TOKEN}" ]; then
            echo "::warning::DEPLOY_DISPATCH_TOKEN не задан — images.yaml в deploy не обновится,"
            echo "::warning::см. docs/ghcr-setup.md в deploy"
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${DEPLOY_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/lct-testkit/deploy/dispatches \
            -d "$(python3 -c "
          import json
          print(json.dumps({
              'event_type': 'frontend-image-built',
              'client_payload': {
                  'image': 'web',
                  'tag': '${{ steps.sha.outputs.short }}',
                  'digest': '${{ steps.build.outputs.digest }}',
              },
          }))
          ")"
